<!doctype html><meta charset="utf-8"><title>render</title>
<style>body{margin:0;background:#000;display:grid;grid-template-columns:1fr 1fr;gap:4px}
canvas{width:100%;display:block}#log{position:fixed;left:0;bottom:0;color:#f66;font:12px monospace;background:#000c}</style>
<body><div id="log"></div>
<script>
const VERT = "#version 300 es\nout vec2 vUv;\nvoid main() {\n  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));\n  vUv = p;\n  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);\n}";
const FRAG = "#version 300 es\nprecision highp float;\nprecision highp int;\nprecision highp sampler2D;\nin vec2 vUv;\nout vec4 outColor;\n\nuniform vec2  uRes;\nuniform float uTime;       // seconds\nuniform float uTravel;     // time that runs faster when the music is louder\nuniform float uCruise;     // the same, eased over ~1 s: vehicles glide instead of lurching\nuniform float uCruiseRate; // current cruise speed factor (~0.45 quiet … ~1.55 loud)\nuniform float uBass, uMid, uHigh, uLevel, uEnergy;\nuniform float uBeat;       // 1 on a beat, decays to 0\nuniform float uBeatAge;    // seconds since the last beat\nuniform float uBeatCount;\nuniform float uBalance;    // stereo balance, -1 left .. +1 right\nuniform float uPunch;      // how hard beats may hit the picture (lowered by \"reduce flashing\")\nuniform float uHue;\nuniform float uHistFrac;\nuniform vec3  uPalA, uPalB, uPalC, uPalD;\nuniform vec3  uPalA2, uPalB2, uPalC2, uPalD2;\nuniform float uPalMix;     // 0 = the first set, 1 = the second; a palette change glides across\nuniform sampler2D uAudio;  // 512x6: spectrum / waveform / peak caps / slow spectrum / left wave / right wave\nuniform sampler2D uHist;   // 128x128 scrolling spectrogram, row 0 = now\nuniform sampler2D uArt;    // album art, valid when uHasArt > 0.5\nuniform sampler2D uText;   // the track title rendered to a 1024x256 canvas (alpha = ink)\nuniform sampler2D uBackdrop; // a photo the user dropped in, valid when uHasBackdrop > 0.5\nuniform float uHasArt, uArtAspect, uHasBackdrop, uBackdropAspect;\nuniform float uSpin;       // record angle in radians, follows the real playback rate\nuniform float uProgress;   // 0..1 through the track\n\n#define PI 3.14159265359\n#define TAU 6.28318530718\n#define ROW(r) ((r + 0.5) / 6.0)\n\nvec3 palOf(vec3 a, vec3 b, vec3 c, vec3 d, float t) { return clamp(a + b * cos(TAU * (c * t + d + uHue)), 0.0, 1.0); }\n// Two palettes, crossfaded by their OUTPUT. Interpolating a, b, c, d instead would be one\n// cosine cheaper but wrong: with different frequencies (Miami is c = [2,1,0], Laser [1,1,1])\n// the halfway parameters describe a palette that is nobody's, and it goes muddy on the way.\nvec3 pal(float t) {\n  return mix(palOf(uPalA, uPalB, uPalC, uPalD, t), palOf(uPalA2, uPalB2, uPalC2, uPalD2, t), uPalMix);\n}\nfloat spec(float x)  { return texture(uAudio, vec2(clamp(x, 0.002, 0.998), ROW(0.0))).r; }\nfloat wave(float x)  { return texture(uAudio, vec2(clamp(x, 0.002, 0.998), ROW(1.0))).r * 2.0 - 1.0; }\nfloat peak(float x)  { return texture(uAudio, vec2(clamp(x, 0.002, 0.998), ROW(2.0))).r; }\nfloat slow(float x)  { return texture(uAudio, vec2(clamp(x, 0.002, 0.998), ROW(3.0))).r; }\nfloat waveL(float x) { return texture(uAudio, vec2(clamp(x, 0.002, 0.998), ROW(4.0))).r * 2.0 - 1.0; }\nfloat waveR(float x) { return texture(uAudio, vec2(clamp(x, 0.002, 0.998), ROW(5.0))).r * 2.0 - 1.0; }\nfloat hist(float x, float age) {\n  float v = (clamp(age, 0.0, 1.0) * 126.0 + 0.5 - uHistFrac) / 128.0;\n  return texture(uHist, vec2(clamp(x, 0.004, 0.996), max(v, 0.5 / 128.0))).r;\n}\n// smoothstep is undefined in GLSL when edge0 > edge1; this version is safe either way round.\nfloat ss(float a, float b, float x) { float t = clamp((x - a) / (b - a), 0.0, 1.0); return t * t * (3.0 - 2.0 * t); }\nmat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }\nfloat hash11(float p) { p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }\nfloat hash21(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }\nfloat noise(vec2 p) {\n  vec2 i = floor(p), f = fract(p);\n  vec2 u = f * f * (3.0 - 2.0 * f);\n  return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x), mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x), u.y);\n}\nfloat fbm(vec2 p) {\n  float a = 0.5, s = 0.0;\n  for (int i = 0; i < 5; i++) { s += a * noise(p); p = rot(0.5) * p * 2.03 + vec2(13.7, 7.1); a *= 0.5; }\n  return s;\n}\nvec2 centered() { return (vUv * 2.0 - 1.0) * vec2(uRes.x / uRes.y, 1.0); }\n\nconst float R = 1.9;     // the camera sits close: the limb only just clears the sides of the frame\nconst float NB = 11.0;   // zonal jets, one per frequency band\n\nfloat beltBand(float bi) { return spec(clamp((bi + 0.5) / NB, 0.0, 1.0) * 0.9 + 0.03); }\n// Neighbouring jets run opposite ways — that counter-flow is what shears the ribbons.\nfloat beltDrift(float bi) { return (mod(bi, 2.0) < 0.5 ? -1.0 : 1.0) * (0.09 + 0.12 * hash11(bi * 1.7 + 0.3)); }\n\nvoid main() {\n  vec2 p = centered() * (1.0 - uBeat * 0.008 * uPunch);\n  p.x -= uBalance * 0.05;\n  vec3 ro = vec3(0.0, 0.0, -3.4);\n  vec3 rd = normalize(vec3(p, 2.0));\n  vec3 sunDir = normalize(vec3(-0.70, 0.32, -0.45));       // sun off to our left, so the right third of the disc is night\n  vec3 haze = mix(vec3(0.70, 0.80, 1.0), pal(0.55), 0.45);\n\n  vec2 g = p * 46.0;\n  vec2 gc = floor(g);\n  vec2 sf = fract(g) - 0.5 - (vec2(hash21(gc + 1.1), hash21(gc + 2.2)) - 0.5) * 0.7;\n  vec3 col = vec3(0.70, 0.80, 1.0) * step(0.965, hash21(gc)) * (0.0009 / (dot(sf, sf) + 0.0018)) * (0.35 + 0.8 * uHigh);\n\n  float b = dot(ro, rd);\n  float disc = b * b - (dot(ro, ro) - R * R);\n  vec3 limbN = normalize(ro + rd * (-b));\n  float miss = sqrt(max(dot(ro, ro) - b * b, 0.0)) - R;\n  col += haze * exp(-max(miss, 0.0) * 24.0) * (0.30 + 0.5 * uLevel) * ss(-0.25, 0.45, dot(limbN, sunDir)) * step(disc, 0.0);\n\n  if (disc > 0.0) {\n    vec3 n = (ro + rd * (-b - sqrt(disc))) / R;\n    vec3 nn = n; nn.yz = rot(0.22) * nn.yz;                // a little axial tilt, so the belts arc across the disc\n    float lat = asin(clamp(nn.y, -1.0, 1.0));\n    float lon = atan(nn.x, -nn.z);                         // measured from the sub-viewer point: the seam stays on the far side\n    float mu = max(dot(n, -rd), 1e-4);                     // 1 face-on, 0 at the limb\n    float detail = ss(0.05, 0.45, mu);                     // the limb is too foreshortened to hold fine noise\n\n    float bf = (lat / PI + 0.5) * NB;\n    float bi = floor(bf);\n    float f = ss(0.3, 0.7, fract(bf));                     // belts stay distinct, but their shear is continuous\n    float band = mix(beltBand(bi), beltBand(bi + 1.0), f);\n    float drift = mix(beltDrift(bi), beltDrift(bi + 1.0), f);\n\n    // Clouds live in longitude/latitude and are stretched ~6:1 along the jets.\n    vec2 q = vec2(lon * 0.70 + uCruise * drift * (0.5 + 1.3 * band), lat * 4.2);\n    float w1 = fbm(q * vec2(1.0, 0.50) + vec2(0.0, 4.3));\n    float w2 = fbm(q * vec2(0.8, 0.60) + vec2(5.1, 1.7));\n    vec2 qw = q + (vec2(w1, w2) - 0.5) * (0.55 + 1.6 * band);   // a loud belt curdles, a quiet one lies flat\n    float cl = fbm(qw) + (fbm(qw * 2.7 + 3.1) - 0.5) * 0.45 * detail;\n    cl = mix(0.5, cl, 0.35 + 0.65 * detail);\n\n    vec3 cream = mix(vec3(0.95, 0.88, 0.72), pal(0.13), 0.28);\n    vec3 ochre = mix(vec3(0.62, 0.40, 0.24), pal(0.03), 0.30);\n    vec3 deep  = mix(vec3(0.26, 0.15, 0.11), pal(0.93), 0.22);\n    float zone = mix(mod(bi, 2.0), mod(bi + 1.0, 2.0), f);  // pale zones alternate with dark belts\n    vec3 cloud = mix(mix(ochre, cream, ss(0.38, 0.78, cl)), mix(deep, ochre, ss(0.30, 0.62, cl)), zone);\n    cloud *= 0.72 + 0.75 * band;\n    cloud += cream * ss(0.74, 0.96, cl) * band * 1.1;       // white plumes pop in whichever belt is loudest\n\n    // The Great Red Spot: an anticyclone turning against its jet, faster at the core than the edge.\n    float sw = 1.0 + 0.38 * uBass + 0.30 * uBeat * uPunch;  // it breathes with the bass\n    float lon0 = -0.10 + 0.32 * sin(uTime * 0.017);         // it drifts along its belt, never far enough to leave the daylight\n    vec2 e = vec2((lon - lon0) / (0.40 * sw), (lat + 0.36) / (0.165 * sw));\n    float rs = length(e);\n    vec2 ew = rot(-(uTime * 0.30 + (1.0 - clamp(rs, 0.0, 1.0)) * 2.6)) * e;\n    float swirl = fbm(ew * 1.8 + vec2(7.3, 2.1));\n    vec3 spotCol = mix(vec3(0.74, 0.25, 0.14), pal(0.0), 0.30) * (0.55 + 0.9 * swirl) * (0.8 + 0.9 * uBass);\n    cloud = mix(cloud, deep * 0.75, (1.0 - ss(0.0, 0.12, abs(rs - 1.08))) * 0.45);   // the collar the storm sweeps clear\n    cloud = mix(cloud, spotCol, (1.0 - ss(0.72, 1.02, rs)) * 0.92);\n\n    float lit = dot(n, sunDir);\n    float day = ss(-0.12, 0.30, lit);                       // the haze carries daylight a little past the terminator\n    float limb = 0.30 + 0.70 * pow(mu, 0.42);               // limb darkening: we look through more air at the edge\n    vec3 shade = cloud * (day * limb * (0.85 + 0.35 * uLevel) + 0.03) + vec3(0.012, 0.016, 0.030) * (1.0 - day);\n\n    // Three storms flash on every beat and are dark again within half a second.\n    float flash = 0.0, halo = 0.0;\n    for (int i = 0; i < 3; i++) {\n      float fi = float(i);\n      vec2 lp = vec2(0.55 + hash11(uBeatCount * 1.7 + fi * 3.1) * 0.95, (hash11(uBeatCount * 2.9 + fi * 5.3) - 0.5) * 1.3);\n      vec2 dl = vec2(lon, lat) - lp;\n      float age = uBeatAge * (1.0 + 0.5 * fi);\n      float strobe = exp(-age * 11.0) * (0.55 + 0.45 * sin(age * 80.0 + fi));\n      flash += exp(-dot(dl, dl) * 150.0) * strobe;\n      halo  += exp(-dot(dl, dl) * 16.0) * strobe * 0.30;\n    }\n    shade += mix(vec3(0.78, 0.86, 1.0), pal(0.6), 0.25) * (flash * ss(0.35, 0.68, cl) + halo) * (1.0 - day) * 2.0 * uPunch;\n\n    // atmosphere: a broad fresnel glow and the thin bright edge of the disc itself\n    float fres = 1.0 - mu;\n    shade += haze * fres * fres * fres * fres * fres * (0.45 + 0.6 * uLevel + 0.5 * uBeat * uPunch) * ss(-0.35, 0.45, lit);\n    shade += haze * (1.0 - ss(0.0, 0.09, mu)) * (0.25 + 0.45 * day);\n    col = shade;\n  }\n  outColor = vec4(col, 1.0);\n}";
// four frames: quiet, loud, right on a beat, and 0.25 s after a beat
const CASES = [
  { t: 12.0, beat: 0.0, beatAge: 2.0,  beatCount: 40, level: 0.25, gain: 0.35 },
  { t: 31.7, beat: 0.0, beatAge: 1.1,  beatCount: 57, level: 0.80, gain: 1.00 },
  { t: 45.2, beat: 1.0, beatAge: 0.02, beatCount: 63, level: 0.85, gain: 1.00 },
  { t: 45.45,beat: 0.2, beatAge: 0.25, beatCount: 63, level: 0.85, gain: 1.00 },
];
function sh(gl, type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { document.getElementById('log').textContent += gl.getShaderInfoLog(s); }
  return s;
}
for (const cs of CASES) {
  const c = document.createElement('canvas'); c.width = 960; c.height = 540; document.body.appendChild(c);
  const gl = c.getContext('webgl2');
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl, gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, sh(gl, gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) document.getElementById('log').textContent += gl.getProgramInfoLog(p);
  gl.useProgram(p);
  // 512x6 audio texture: a plausible music spectrum, brightest in the bass, with a couple of peaks
  const data = new Uint8Array(512 * 6 * 4);
  for (let x = 0; x < 512; x++) {
    const f = x / 511;
    let v = Math.pow(1 - f, 1.6) * 0.9 + 0.12;
    v += 0.30 * Math.exp(-Math.pow((f - 0.28) / 0.05, 2));   // a mid peak
    v += 0.22 * Math.exp(-Math.pow((f - 0.62) / 0.04, 2));   // a high one
    v *= cs.gain;
    for (let r = 0; r < 6; r++) {
      const i = (r * 512 + x) * 4;
      const val = r === 1 || r === 4 || r === 5 ? 128 + 90 * Math.sin(x * 0.3) * cs.gain : 255 * Math.min(v, 1);
      data[i] = data[i + 1] = data[i + 2] = val; data[i + 3] = 255;
    }
  }
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 512, 6, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const U = n => gl.getUniformLocation(p, n);
  gl.uniform2f(U('uRes'), c.width, c.height);
  gl.uniform1f(U('uTime'), cs.t); gl.uniform1f(U('uTravel'), cs.t * 1.1); gl.uniform1f(U('uCruise'), cs.t * 1.05);
  gl.uniform1f(U('uCruiseRate'), 1.0);
  gl.uniform1f(U('uBass'), 0.75 * cs.gain); gl.uniform1f(U('uMid'), 0.5 * cs.gain);
  gl.uniform1f(U('uHigh'), 0.4 * cs.gain); gl.uniform1f(U('uLevel'), cs.level); gl.uniform1f(U('uEnergy'), cs.level);
  gl.uniform1f(U('uBeat'), cs.beat); gl.uniform1f(U('uBeatAge'), cs.beatAge); gl.uniform1f(U('uBeatCount'), cs.beatCount);
  gl.uniform1f(U('uBalance'), 0.1); gl.uniform1f(U('uPunch'), 1.0); gl.uniform1f(U('uHue'), 0.0);
  gl.uniform1f(U('uHistFrac'), 0.0); gl.uniform1f(U('uSpin'), cs.t); gl.uniform1f(U('uProgress'), 0.4);
  gl.uniform1f(U('uPalMix'), 0.0);
  gl.uniform3f(U('uPalA'), 0.5, 0.5, 0.5); gl.uniform3f(U('uPalB'), 0.5, 0.5, 0.5);
  gl.uniform3f(U('uPalC'), 1.0, 1.0, 1.0); gl.uniform3f(U('uPalD'), 0.0, 0.33, 0.67);
  gl.uniform3f(U('uPalA2'), 0.5, 0.5, 0.5); gl.uniform3f(U('uPalB2'), 0.5, 0.5, 0.5);
  gl.uniform3f(U('uPalC2'), 1.0, 1.0, 1.0); gl.uniform3f(U('uPalD2'), 0.0, 0.33, 0.67);
  gl.uniform1i(U('uAudio'), 0);
  gl.uniform1f(U('uHasArt'), 0); gl.uniform1f(U('uHasBackdrop'), 0);
  gl.uniform1f(U('uArtAspect'), 1); gl.uniform1f(U('uBackdropAspect'), 1);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
  for (const n of ['uHist','uArt','uText','uBackdrop']) gl.uniform1i(U(n), 0);
  gl.viewport(0, 0, c.width, c.height);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
</script>
